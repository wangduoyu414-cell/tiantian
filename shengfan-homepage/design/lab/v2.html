<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>青绿长卷 · 构件实验</title><link rel="stylesheet" href="../../assets/css/art2.css">
<style>body{margin:0;background:#efe6d3;font:13px -apple-system,"PingFang SC",sans-serif;color:#2e2b26}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(520px,1fr));gap:24px;padding:24px}
figure{margin:0;background:#f3ebd9;border:1px solid rgba(46,43,38,.12);border-radius:10px;padding:18px}
figcaption{margin-top:8px;opacity:.6}svg{width:100%;height:auto;display:block}</style></head>
<body><div id="defs"></div><div class="grid" id="grid"></div>
<script src="../../assets/js/art2.js"></script>
<script>document.getElementById('defs').innerHTML=ART2.defs();const g=document.getElementById('grid'),only=new URLSearchParams(location.search).get('only');
for(const [n,f] of Object.entries(ART2.LANDMARKS)){if(only&&only!==n)continue;const L=f(),[l,r,b,t]=L.box,p=6;const fig=document.createElement('figure');
fig.innerHTML=`<svg class="a2" viewBox="${l-p} ${-t-p} ${r-l+p*2} ${t-b+p*2}"><g transform="scale(1 -1)">${L.g}</g></svg><figcaption>${n}</figcaption>`;g.appendChild(fig);}</script>
</body></html>
