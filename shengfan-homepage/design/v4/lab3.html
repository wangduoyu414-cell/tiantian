<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>景物试验二</title>
<link rel="stylesheet" href="../../assets/css/jh.css">
<style>html, body { margin: 0; background: #efe6d3; } .row { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-end; padding: 20px; } .jh-svg { display: block; overflow: visible; }</style></head>
<body><div id="defs"></div><div id="out"></div>
<script src="../../assets/js/jh/core.js"></script><script src="../../assets/js/jh/arch.js"></script><script src="../../assets/js/jh/nature.js"></script>
<script>
document.getElementById('defs').innerHTML = JH.ARCH.defs();
const Nt = JH.NATURE, items = [Nt.willow({ h: 200, seed: 7, density: 0.5 }), Nt.willow({ h: 200, seed: 9, lean: -1, density: 0.5 }), Nt.pineBough({ len: 340, seed: 3, droop: 0.1 })];
document.getElementById('out').innerHTML = '<div class="row">' + items.map(L => JH.svg(L, 2)).join('') + '</div>';
</script></body></html>
