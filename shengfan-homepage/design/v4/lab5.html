<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>朱墨试验</title>
<link rel="stylesheet" href="../../assets/css/jh.css">
<style>html, body { margin: 0; background: #f2e8d8; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: #5a5048; } .row { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end; padding: 20px; } figure { margin: 0; text-align: center; } .jh-svg { display: block; margin: 0 auto; overflow: visible; }</style></head>
<body><div id="defs"></div><div id="out" class="zm"></div>
<script src="../../assets/js/jh/core.js"></script><script src="../../assets/js/jh/arch.js"></script><script src="../../assets/js/jh/build.js"></script><script src="../../assets/js/jh/nature.js"></script><script src="../../assets/js/jh/icons.js"></script><script src="../../assets/js/jh/red.js"></script>
<script>
document.getElementById('defs').innerHTML = JH.ARCH.defs() + JH.RED.defs();
const q = new URLSearchParams(location.search), only = (q.get('only') || '').split(',').filter(Boolean), H = +(q.get('h') || 260);
const R = JH.RED, items = ['honglou', 'lidazhao', 'lugou', 'shuangqing', 'dangshi', 'vField', 'vDay', 'vLecture', 'vScene', 'bus', 'meeting'].filter(k => !only.length || only.includes(k));
document.getElementById('out').innerHTML = '<div class="row">' + items.map(k => { const L = R[k](); return `<figure>${JH.svg(L, H / (L.box[3] - L.box[2] + 12))}<figcaption>${k}</figcaption></figure>`; }).join('') + '</div>';
</script></body></html>
